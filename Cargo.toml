[package]
name = "discord-bot-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
rustls = { version = "0.23", features = ["ring"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
